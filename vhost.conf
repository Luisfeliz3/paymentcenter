<VirtualHost *:443>
 
    ServerName orutech.co
    SSL Engine on
    SSLCertificateFile "/opt/bitnami/apache/conf/orutech.co.crt"
    SSLCertificateKeyFile "/opt/bitnami/apache/conf/orutech.co.key"
    # Other directives here
</VirtualHost>
<VirtualHost *:443>
 
    ServerName server.orutech.co
    ProxyPass / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/
    SSLEngine on
    SSLCertificateFile "/opt/bitnami/apache/conf/orutech.co.crt"
    SSLCertificateKeyFile "/opt/bitnami/apache/conf/orutech.co.key"
    # Other directives here
</VirtualHost>
